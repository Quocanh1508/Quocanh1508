<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
<title id="t">Black Shores at night</title>
<desc id="d">A night sea under drifting stars, with glowing butterflies rising over the tide.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050914"/><stop offset=".62" stop-color="#0a1022"/><stop offset="1" stop-color="#12264a"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b3a66" stop-opacity=".9"/><stop offset="1" stop-color="#050914"/>
  </linearGradient>
  <radialGradient id="moon" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#eaf4ff"/><stop offset=".45" stop-color="#a8e6f5" stop-opacity=".55"/><stop offset="1" stop-color="#a8e6f5" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a8e6f5" stop-opacity=".9"/><stop offset="1" stop-color="#a8e6f5" stop-opacity="0"/>
  </radialGradient>
  <symbol id="fly" viewBox="-12 -10 24 20">
    <path d="M0,0 C-4,-9 -12,-9 -10,-2 C-9,2 -4,2 0,0 Z M0,0 C4,-9 12,-9 10,-2 C9,2 4,2 0,0 Z M0,0 C-3,3 -8,8 -5,9 C-2,9 -1,4 0,0 Z M0,0 C3,3 8,8 5,9 C2,9 1,4 0,0 Z" fill="#a8e6f5"/>
  </symbol>
  <style>
    .star { fill: #eaf4ff; animation: twinkle 3.2s ease-in-out infinite; }
    .fly { animation: rise 9s ease-in-out infinite; }
    .wave { animation: drift 7s ease-in-out infinite alternate; }
    .title { font: 600 40px 'Segoe UI', system-ui, sans-serif; fill: #eaf4ff; letter-spacing: 6px; }
    .sub { font: 14px 'Fira Code', ui-monospace, monospace; fill: #7f93b8; letter-spacing: 3px; }
    @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes rise { 0% { transform: translate(0, 40px); opacity: 0; } 20% { opacity: .9; } 80% { opacity: .9; } 100% { transform: translate(30px, -160px); opacity: 0; } }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    @media (prefers-reduced-motion: reduce) { .star, .fly, .wave { animation: none; } .fly { opacity: .7; } }
  </style>
</defs>
<rect width="1200" height="260" fill="url(#sky)"/>
<circle cx="980" cy="70" r="70" fill="url(#moon)"/>
<circle cx="980" cy="70" r="20" fill="#eaf4ff" opacity=".9"/>
<g>
  <circle class="star" cx="60" cy="40" r="1.4"/><circle class="star" cx="140" cy="95" r="1" style="animation-delay:.6s"/>
  <circle class="star" cx="230" cy="30" r="1.6" style="animation-delay:1.2s"/><circle class="star" cx="320" cy="120" r="1" style="animation-delay:2s"/>
  <circle class="star" cx="410" cy="55" r="1.3" style="animation-delay:.3s"/><circle class="star" cx="500" cy="20" r="1" style="animation-delay:1.7s"/>
  <circle class="star" cx="590" cy="105" r="1.5" style="animation-delay:2.4s"/><circle class="star" cx="680" cy="40" r="1" style="animation-delay:.9s"/>
  <circle class="star" cx="760" cy="135" r="1.2" style="animation-delay:1.4s"/><circle class="star" cx="850" cy="25" r="1.6" style="animation-delay:2.8s"/>
  <circle class="star" cx="1090" cy="140" r="1" style="animation-delay:.5s"/><circle class="star" cx="1150" cy="45" r="1.4" style="animation-delay:1.9s"/>
  <circle class="star" cx="890" cy="160" r="1" style="animation-delay:2.2s"/><circle class="star" cx="1040" cy="190" r="1.1" style="animation-delay:1s"/>
</g>
<path d="M0,200 Q150,185 300,200 T600,200 T900,200 T1200,200 V260 H0 Z" fill="url(#sea)"/>
<path class="wave" d="M-60,208 Q90,196 240,208 T540,208 T840,208 T1140,208 T1440,208" fill="none" stroke="#5fb3d9" stroke-opacity=".5" stroke-width="1.5"/>
<path class="wave" d="M-60,226 Q90,216 240,226 T540,226 T840,226 T1140,226 T1440,226" fill="none" stroke="#2f6a9a" stroke-opacity=".6" stroke-width="1.2" style="animation-delay:-3s"/>
<path d="M980,205 v50" stroke="#a8e6f5" stroke-opacity=".25" stroke-width="16" stroke-linecap="round"/>
<g class="fly"><circle cx="170" cy="190" r="14" fill="url(#glow)"/><use href="#fly" x="158" y="180" width="24" height="20"/></g>
<g class="fly" style="animation-delay:-3s"><circle cx="860" cy="200" r="12" fill="url(#glow)"/><use href="#fly" x="850" y="191" width="20" height="17"/></g>
<g class="fly" style="animation-delay:-6s"><circle cx="1080" cy="195" r="10" fill="url(#glow)"/><use href="#fly" x="1072" y="188" width="16" height="14"/></g>
<text x="600" y="118" text-anchor="middle" class="title">NGUYỄN ĐẶNG QUỐC ANH</text>
<text x="600" y="152" text-anchor="middle" class="sub">FULL-STACK · IoT · DATA — WATCHING OVER THE TIDE</text>
</svg>
